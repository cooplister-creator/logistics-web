<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Логистика</title>
<meta name="theme-color" content="#081425">
<style>
:root{--bg:#081425;--card:rgba(8,21,40,.94);--gold:#d8b46a;--gold2:#f3dc9d;--cyan:#41e0ee;--text:#e7eef8;--muted:#8fa3bd;--line:rgba(143,163,189,.28)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);background:
radial-gradient(ellipse 80% 50% at 50% -8%,#15396a 0%,transparent 70%),
repeating-linear-gradient(90deg,rgba(65,224,238,.035) 0 1px,transparent 1px 46px),
repeating-linear-gradient(0deg,rgba(65,224,238,.035) 0 1px,transparent 1px 46px),var(--bg);background-attachment:fixed}
#app{min-height:100vh}
.card{max-width:430px;margin:5vh auto;padding:26px 24px 24px;border-radius:18px;border:1px solid transparent;
background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--gold),rgba(65,224,238,.55) 50%,var(--gold)) border-box;
box-shadow:0 0 50px rgba(65,224,238,.09),0 14px 44px rgba(0,0,0,.55);backdrop-filter:blur(6px)}
img.logo{-webkit-mask-image:radial-gradient(ellipse 80% 86% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 80% 86% at 50% 50%,#000 70%,transparent 100%);mix-blend-mode:lighten;display:block;width:100%;max-width:300px;margin:-6px auto 4px;animation:glow 4.5s ease-in-out infinite}
img.emb{-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(circle at 50% 50%,#000 55%,transparent 100%);mix-blend-mode:lighten;width:34px;height:auto;display:block;filter:drop-shadow(0 0 6px rgba(65,224,238,.6))}
img.embc{-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(circle at 50% 50%,#000 55%,transparent 100%);mix-blend-mode:lighten;width:64px;margin:0 auto 6px;display:block;filter:drop-shadow(0 0 10px rgba(65,224,238,.55))}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px rgba(65,224,238,.25))}50%{filter:drop-shadow(0 0 20px rgba(65,224,238,.55))}}
@media (prefers-reduced-motion:reduce){img.logo{animation:none}}
h1{margin:0 0 4px;font-size:22px;letter-spacing:.4px;text-align:center;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px;text-align:center}
label{display:block;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);margin:14px 0 5px}
input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:16px;color:var(--text);background:rgba(4,12,26,.75);outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#5d7391}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(65,224,238,.18),0 0 18px rgba(65,224,238,.15)}
button{font:inherit;font-weight:700;letter-spacing:.4px;padding:12px 18px;border:0;cursor:pointer;color:#1a1200;
background:linear-gradient(180deg,var(--gold2),#c79a45);
clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.1) saturate(1.1)}
button:active{transform:translateY(1px)}
button:disabled{filter:grayscale(.7) brightness(.7);cursor:wait}
button.full{width:100%;margin-top:18px}
button.ghost{color:var(--cyan);background:rgba(65,224,238,.08);box-shadow:inset 0 0 0 1px rgba(65,224,238,.55)}
button.ghost:hover{background:rgba(65,224,238,.16)}
button.sm{padding:7px 12px;font-size:14px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
button.red{color:#fff;background:linear-gradient(180deg,#e5575d,#b3262d)}
button.link{background:none;clip-path:none;color:var(--cyan);padding:0;font-size:14px;font-weight:600;margin-top:14px;letter-spacing:0}
button.link:hover{text-decoration:underline}
.err{color:#ff8a8a;font-size:14px;margin-top:10px;min-height:18px}
.ok{color:#6fe3a0}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(180deg,#0f2a4f,#0a1d38);border-bottom:1px solid rgba(216,180,106,.5);box-shadow:0 4px 22px rgba(0,0,0,.45)}
header b{flex:1;font-size:18px;letter-spacing:.6px;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
header span{color:var(--muted);font-size:14px}
nav{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid var(--line);background:rgba(6,16,32,.6)}
nav button{white-space:nowrap;color:var(--muted);background:rgba(143,163,189,.1);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
nav button.on{color:#1a1200;background:linear-gradient(180deg,var(--gold2),#c79a45);box-shadow:none}
main{max-width:900px;margin:0 auto;padding:16px}
.row{display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:9px;border-radius:12px;border:1px solid var(--line);background:rgba(12,32,60,.6)}
.row .grow{flex:1;min-width:0}
.row .n{font-weight:600}
.row .m{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;border-radius:7px;padding:3px 8px;background:rgba(216,180,106,.16);color:var(--gold2);border:1px solid rgba(216,180,106,.4)}
.badge.g{background:rgba(111,227,160,.12);color:#6fe3a0;border-color:rgba(111,227,160,.4)}
.empty{color:var(--muted);text-align:center;padding:34px 0}
.ver{text-align:center;color:#4f6685;font-size:12px;margin:16px 0}
textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;color:var(--text);background:rgba(4,12,26,.75);outline:none;resize:vertical}
select option{background:#0a1d38}
textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(65,224,238,.18)}
.grow{flex:1}
main.wide{max-width:1500px}
.req .rbar{display:none;gap:8px;margin-bottom:12px}
.req .rbar button{flex:1;color:var(--muted);background:rgba(143,163,189,.1);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.req .rbar button.on{color:#1a1200;background:linear-gradient(180deg,var(--gold2),#c79a45);box-shadow:none}
.rgrid{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:18px;align-items:start}
.rprev{position:sticky;top:8px}
.sect{margin:22px 0 4px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold2);border-bottom:1px solid rgba(216,180,106,.35);padding-bottom:4px}
.sect:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fld.wide{grid-column:1/-1}
.ccard{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(12,32,60,.55)}
.chead{display:flex;align-items:center;gap:8px;color:var(--cyan)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts button{flex:1;min-width:130px}
.warn{font-size:13px;color:#ffcf7a;margin:10px 0}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
.pv{background:#fff;border-radius:6px;overflow:hidden;margin-top:8px}
.paper{background:#fff;color:#000;font:12px/1.25 "Times New Roman",serif;padding:14px;box-sizing:border-box}
.paper.zay{width:1120px}.paper.por{width:760px;font-size:13px}
.paper table{border-collapse:collapse;width:100%;margin:0}
.paper td,.paper th{border:1px solid #000;padding:2px 4px;vertical-align:top;text-align:left}
.paper th{font-weight:bold;font-size:10px;text-align:center}
.paper .r{text-align:right;font-style:italic}.paper .t{text-align:center;font-weight:bold;font-size:15px;margin:4px 0}
.paper .c{text-align:center;margin-bottom:6px}.paper .k{width:38%;font-weight:bold}.paper .k2{width:28px;text-align:center;font-weight:bold}
.paper .band{border:1px solid #000;background:#d9d9d9;text-align:center;font-weight:bold;padding:2px}
.paper .band.n{background:#fff;text-align:left}.paper .band.b{background:#fff;text-align:left;font-weight:bold}
.paper .legal{border:1px solid #000;padding:4px;font-size:10px;text-align:justify}
.paper .sig td{border:0}.paper .sig .nm{border-bottom:1px solid #000;text-align:center}.paper .sig .cap{text-align:center;font-size:10px}
.paper td.s{font-weight:bold;background:#eee}.paper td.i{font-style:italic}
.paper .t2{text-align:center;font-weight:bold}.paper .j{text-align:justify;margin:8px 0}
#printroot{display:none}
@media (max-width:900px){
 .req .rbar{display:flex}.rgrid{display:block}
 .req[data-view=form] .rprev>.pv,.req[data-view=form] .rprev>.warn,.req[data-view=form] .rprev>.hint{display:none}
 .req:not([data-view=form]) .rform{display:none}.rprev{position:static}
}
@media print{
 body.printing #app,body.printing .ver{display:none}
 body.printing{background:#fff}
 body.printing #printroot{display:block}
 body.printing .paper{width:auto!important;padding:0}
}
.rtop{display:flex;gap:8px;margin-bottom:12px}
.rodiv{padding:11px 13px;border:1px dashed var(--line);border-radius:10px;color:var(--text);background:rgba(4,12,26,.4)}
.cbtn{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fld select{margin-bottom:6px}
.req.islist .rbar{display:none!important}
.xparty{grid-column:1/-1;margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(12,32,60,.4)}
.xparty .xt{color:var(--cyan);font-weight:700;margin-bottom:6px}
.paper .sig2 td{border:0;padding-top:14px;width:50%}
.rsel{display:flex;gap:8px;align-items:center}.rsel select{margin-bottom:0;flex:1}
.fld textarea{margin-top:6px}
details.xdet{margin-top:22px}
details.xdet>summary{cursor:pointer;list-style:none;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold2);border-bottom:1px solid rgba(216,180,106,.35);padding-bottom:4px;margin-bottom:8px}
details.xdet>summary::-webkit-details-marker{display:none}
details.xdet>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.xdet[open]>summary::before{content:"▾ "}
.sect{background:linear-gradient(90deg,rgba(216,180,106,.25),rgba(216,180,106,.03));border:0;border-left:4px solid var(--gold);border-radius:6px;padding:9px 12px;margin:30px 0 12px;font-size:14px;font-weight:700;letter-spacing:1.2px;color:#f1d9a0}
.sect:first-child{margin-top:0}
details.xdet>summary{background:linear-gradient(90deg,rgba(65,224,238,.18),rgba(65,224,238,.03));border:0;border-left:4px solid var(--cyan);border-radius:6px;padding:9px 12px;margin:30px 0 12px;font-size:14px;font-weight:700;letter-spacing:1.2px;color:var(--cyan)}
</style>
</head>

const app = document.getElementById("app");
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function show(...nodes) { app.innerHTML = ""; app.append(...nodes); }
function errText(e) {
  const c = e && e.code || "";
  const m = {
    "auth/invalid-email": "Неверный адрес почты",
    "auth/email-already-in-use": "Эта почта уже зарегистрирована",
    "auth/weak-password": "Пароль слишком простой (минимум 6 символов)",
    "auth/wrong-password": "Неверная почта или пароль",
    "auth/invalid-credential": "Неверная почта или пароль",
    "auth/user-not-found": "Неверная почта или пароль",
    "auth/too-many-requests": "Слишком много попыток, подождите немного",
    "auth/network-request-failed": "Нет связи с сервером"
  };
  return m[c] || ("Ошибка: " + (c || (e && e.message) || e));
}

let unsubProfile = null;
let unsubUsers = null;

/* ---------- экраны входа ---------- */
function loginScreen(mode) {
  const reg = mode === "reg";
  const name = h("input", { type: "text", autocomplete: "name", placeholder: "Фамилия Имя" });
  const email = h("input", { type: "email", autocomplete: "email", placeholder: "name@mail.ru" });
  const pass = h("input", { type: "password", autocomplete: reg ? "new-password" : "current-password", placeholder: "Пароль" });
  const err = h("div", { class: "err" });
  const go = h("button", { class: "full" }, reg ? "Зарегистрироваться" : "Войти");
  go.onclick = async () => {
    err.textContent = "";
    const em = email.value.trim(), pw = pass.value;
    if (!em || !pw) { err.textContent = "Заполните почту и пароль"; return; }
    if (reg && name.value.trim().length < 2) { err.textContent = "Укажите фамилию и имя"; return; }
    go.disabled = true;
    try {
      if (reg) {
        localStorage.setItem("pendingName", name.value.trim());
        const r = await auth.createUserWithEmailAndPassword(em, pw);
        try { await r.user.sendEmailVerification(); } catch (e) {}
      } else {
        await auth.signInWithEmailAndPassword(em, pw);
      }
    } catch (e) { err.textContent = errText(e); go.disabled = false; }
  };
  const forgot = h("button", { class: "link", onclick: async () => {
    const em = email.value.trim();
    if (!em) { err.textContent = "Введите почту, затем нажмите «Забыли пароль»"; return; }
    try { await auth.sendPasswordResetEmail(em); err.className = "err ok"; err.textContent = "Письмо для сброса пароля отправлено"; }
    catch (e) { err.className = "err"; err.textContent = errText(e); }
  } }, "Забыли пароль?");
  const sw = h("button", { class: "link", onclick: () => loginScreen(reg ? "login" : "reg") },
    reg ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться");
  show(h("div", { class: "card" },
    h("img", { class: "logo", src: LOGO, alt: "Логистика" }),
    h("h1", {}, reg ? "Регистрация" : "Вход"),
    h("p", { class: "sub" }, reg ? "Доступ откроется после одобрения администратором." : "Личный кабинет клиента"),
    reg ? [h("label", {}, "Фамилия и имя"), name] : null,
    h("label", {}, "Почта"), email,
    h("label", {}, "Пароль"), pass,
    err, go,
    reg ? null : forgot,
    h("div", {}, sw)));
}

function verifyScreen(user) {
  const err = h("div", { class: "err" });
  show(h("div", { class: "card" },
    h("img", { class: "embc", src: EMBLEM, alt: "" }),
    h("h1", {}, "Подтвердите почту"),
    h("p", { class: "sub" }, "Мы отправили письмо на " + user.email + ". Перейдите по ссылке в письме (проверьте папку «Спам»), затем нажмите кнопку ниже."),
    err,
    h("button", { class: "full", onclick: async () => {
      err.className = "err"; err.textContent = "";
      try {
        await user.reload();
        await user.getIdToken(true);
        const u = auth.currentUser;
        if (u && u.emailVerified) route(u); else err.textContent = "Почта ещё не подтверждена";
      } catch (e) { err.textContent = errText(e); }
    } }, "Я подтвердил"),
    h("button", { class: "full ghost", onclick: async () => {
      try { await user.sendEmailVerification(); err.className = "err ok"; err.textContent = "Письмо отправлено повторно"; }
      catch (e) { err.className = "err"; err.textContent = errText(e); }
    } }, "Отправить письмо ещё раз"),
    h("button", { class: "link", onclick: () => auth.signOut() }, "Выйти")));
}

function pendingScreen(user) {
  show(h("div", { class: "card" },
    h("img", { class: "embc", src: EMBLEM, alt: "" }),
    h("h1", {}, "Ожидайте одобрения"),
    h("p", { class: "sub" }, "Аккаунт " + user.email + " создан. Как только администратор откроет доступ, страница обновится сама."),
    h("button", { class: "link", onclick: () => auth.signOut() }, "Выйти")));

    const save = h("button", { class: "sm ghost", onclick: async () => {

    const del = cur ? h("button", { class: "sm red", onclick: async () => { if (!confirm("Удалить «" + cur.label + "»?")) return; try { await refCol(uid).doc(cur.id).delete(); REFS[type] = REFS[type].filter(x => x.id !== cur.id); sel[key] = ""; drawForm(); } catch (e) { msg.textContent = errText(e); } } }, "Удалить") : null;
    const upd = cur ? h("button", { class: "sm ghost", onclick: async () => { try { await refCol(uid).doc(cur.id).update({ text: JSON.stringify(p) }); cur.text = JSON.stringify(p); msg.className = "ok"; msg.textContent = "Организация обновлена"; } catch (e) { msg.textContent = errText(e); } } }, "Обновить") : null;
    return h("div", { class: "xparty" }, h("div", { class: "xt" }, title), pick,
      h("div", { class: "grid2" }, field("Название", p, "name", { wide: 1 }), field("ИНН", p, "inn"), field("КПП", p, "kpp"), field("Адрес", p, "addr", { wide: 1, area: 1 }), field("Телефон", p, "tel"), withOgrn ? field("ОГРН", p, "ogrn") : null),
      h("div", { class: "cbtn" }, save, upd, del));
  }
  function contCard(c, i) {
    return h("div", { class: "ccard" },
      h("div", { class: "chead" }, h("b", {}, "Контейнер " + (i + 1)), h("span", { class: "grow" }),
        h("button", { class: "sm ghost", onclick: () => { TU.cont.splice(i + 1, 0, Object.assign({}, c)); drawForm(); changed(); } }, "Копия"),
        TU.cont.length > 1 ? h("button", { class: "sm red", onclick: () => { TU.cont.splice(i, 1); drawForm(); changed(); } }, "Удалить") : null),
      h("div", { class: "grid2" },
        field("Номер контейнера", c, "no", { ph: "ABCD1234567" }), field("Тип", c, "type", { list: "uctypes" }),
        field("Вес брутто, кг", c, "gross", { num: 1 }), field("Вес нетто, кг (для XML)", c, "net", { num: 1 }),
        field("Количество мест", c, "pcs", { num: 1 }), field("Вес тары, кг", c, "tare", { num: 1 }),
        field("Пломба (как в поручении)", c, "seal", { wide: 1, ph: "HAXMN04391 (Штатное место)" }), field("Номер ДТ", c, "dt", { wide: 1 })));
  }
  function initSel() { ["dest", "term", "note", "shipper"].forEach(k => { const m = allU(k).find(x => x.text === TU[k]); sel[k] = m ? m.id : ""; }); }
  function drawForm() {
    formPane.innerHTML = "";
    formPane.append(
      sect("Поручение"),
      h("div", { class: "grid2" }, field("Номер", TU, "num"), field("Дата", TU, "date"), field("Договор (номер от дата)", TU, "contract", { wide: 1, ph: "29/08 от 29.08.2023" })),
      sect("Маршрут и стороны"),
      h("div", { class: "grid2" },
        field("Станция и дорога отправления", TU, "depart", { wide: 1 }), refSel("Грузоотправитель", "shipper", "shipper"), field("Адрес грузоотправителя", TU, "shipAddr", { wide: 1 }),
        field("Страна назначения", TU, "destCountry"), refSel("Станция и дорога назначения", "dest", "dest", { rows: 2 }),
        refSel("Грузополучатель терминал, код ОКПО", "term", "term"), field("Адрес терминала", TU, "termAddr", { wide: 1 })),
      sect("Груз"),
      h("div", { class: "grid2" },
        field("Наименование по ЕТСНГ", TU, "etsngName", { wide: 1, area: 1 }), field("Код ЕТСНГ", TU, "etsngCode", { num: 1 }),
        field("Наименование по ГНГ", TU, "gngName", { wide: 1, area: 1 }), field("Код ГНГ", TU, "gngCode", { num: 1 }),
        field("Охрана", TU, "guard", { select: [["нет", "нет"], ["да", "да"]] }), field("Тип подвижного состава", TU, "stock", { wide: 1 })),
      sect("Контейнеры"), ...TU.cont.map(contCard),
      h("button", { class: "full ghost", onclick: () => { const l = TU.cont[TU.cont.length - 1]; TU.cont.push(Object.assign(newUCont(), { type: l.type })); drawForm(); changed(); } }, "+ Добавить контейнер"),
      sect("Прочее"),
      h("div", { class: "grid2" }, field("Получатель порожнего оборудования", TU, "emptyTo", { wide: 1 }), field("Услуги", TU, "service"), field("Собственник контейнеров", TU, "owner"),
        refSel("Примечание (конечный грузополучатель)", "note", "note", { rows: 4 })),
      sect("Данные для XML (хранятся только в вашем аккаунте)"),
      partyBlock("Грузоотправитель", "xShip", "pShip"), partyBlock("Грузополучатель (терминал)", "xCons", "pCons"), partyBlock("Экспедитор", "xExp", "pExp", true), partyBlock("Клиент", "xClient", "pClient"),
      h("div", { class: "grid2" }, field("Адрес приёма груза (если не как у грузоотправителя)", TU, "recvAddr", { wide: 1, area: 1 }), field("Адрес выдачи на станции (если не как у терминала)", TU, "destAddr", { wide: 1, area: 1 })),
      h("datalist", { id: "uctypes" }, ...["20DC", "40DC", "40HC", "20HC"].map(t => h("option", { value: t }))));
  }
  async function drawList() {
    listBox.innerHTML = ""; listBox.append(h("div", { class: "empty" }, "Загрузка…"));
    try {
      const q = await reqCol(uid).orderBy("updatedAt", "desc").limit(200).get(); listBox.innerHTML = ""; let n = 0;
      q.forEach(doc => {
        const d = doc.data(); if (d.kind !== "un") return; n++;
        listBox.append(h("div", { class: "row" },
          h("div", { class: "grow" }, h("div", { class: "n" }, "№ " + (d.num || "б/н") + " от " + (d.date || "")), h("div", { class: "m" }, d.conts || "")),
          h("button", { class: "sm", onclick: () => { try { TU = Object.assign(TU_DEF(), JSON.parse(d.json)); ["xShip", "xCons", "xExp", "xClient"].forEach(k => TU[k] = Object.assign(emptyParty(), TU[k])); TU.cont = (TU.cont || [newUCont()]).map(c => Object.assign(newUCont(), c)); } catch (e) { msg.textContent = "Заявка повреждена"; return; } TU._id = doc.id; initSel(); saveUn(); drawForm(); setMode("edit"); } }, "Открыть"),
          h("button", { class: "sm red", onclick: async () => { if (!confirm("Удалить заявку № " + (d.num || "б/н") + "?")) return; try { await reqCol(uid).doc(doc.id).delete(); if (TU._id === doc.id) delete TU._id; drawList(); } catch (e) { msg.textContent = errText(e); } } }, "Удалить")));
      });
      if (!n) listBox.append(h("div", { class: "empty" }, "Сохранённых заявок пока нет"));
    } catch (e) { listBox.innerHTML = ""; listBox.append(h("div", { class: "err" }, "Не удалось загрузить список: " + errText(e))); }
  }
  async function saveReq() {
    const o = Object.assign({}, TU); delete o._id;
    const data = { kind: "un", num: trim(TU.num), date: TU.date, client: "", conts: TU.cont.map(c => trim(c.no)).filter(Boolean).join(", ").slice(0, 120), json: JSON.stringify(o), updatedAt: Date.now() };
    if (TU._id) await reqCol(uid).doc(TU._id).set(data); else { const r = await reqCol(uid).add(data); TU._id = r.id; }
    saveUn(); drawTop(); msg.className = "ok"; msg.textContent = "Заявка сохранена: её можно открыть в «Мои заявки»";
  }
  const run = async fn => { msg.className = "err"; msg.textContent = ""; try { await fn(); } catch (e) { msg.textContent = (e && e.code ? errText(e) : e && e.message) || String(e); } };
  const actions = h("div", { class: "acts" },
    h("button", { onclick: () => run(saveReq) }, "Сохранить заявку"),
    h("button", { class: "ghost", onclick: () => { if (!confirm("Начать новую заявку? Несохранённое будет потеряно.")) return; const keep = { xShip: TU.xShip, xCons: TU.xCons, xExp: TU.xExp, xClient: TU.xClient, contract: TU.contract }; TU = Object.assign(TU_DEF(), keep); initSel(); saveUn(); drawForm(); drawTop(); drawPrev(); } }, "Новая заявка"),
    h("button", { class: "ghost", onclick: () => unPrint() }, "Поручение PDF"),
    h("button", { class: "ghost", onclick: () => unWord() }, "Поручение Word"),
    h("button", { class: "ghost", onclick: () => run(unXml) }, "Поручение XML"));
  const hint = h("div", { class: "hint" }, "PDF: в окне печати выберите «Сохранить как PDF». Подпись и печать добавьте вручную. XML без подписи, номера и доверенности: их добавит программа.");
  prevPane.append(actions, msg, warn, pv, hint); editBox.append(formPane, prevPane); root.append(top, bar, editBox, listBox); box.append(root);
  listBox.style.display = "none"; initSel(); drawTop(); drawBar(); drawForm(); drawPrev();
  loadRefs(uid).then(() => { initSel(); drawForm(); }).catch(() => { msg.textContent = "Сохранённые карточки пока недоступны (проверьте правила Firestore)"; });
  window.addEventListener("resize", fit); setTimeout(fit, 50);
}

/* ---------- основной экран ---------- */
function mainScreen(user, prof) {
  const tabs = [["req", "Транссинергия"], ["un", "Юнион"], ["trk", "Слежение"]];
  if (prof.admin) tabs.push(["usr", "Пользователи"]);
  let cur = "req";
  const body = h("main", {});
  const nav = h("nav", {});
  const draw = () => {
    nav.innerHTML = "";
    tabs.forEach(t => nav.append(h("button", { class: cur === t[0] ? "on" : "", onclick: () => { cur = t[0]; draw(); } }, t[1])));
    if (unsubUsers) { unsubUsers(); unsubUsers = null; }
    body.innerHTML = "";
    body.className = cur === "req" || cur === "un" ? "wide" : "";
    if (cur === "usr") usersPanel(body, user);
    else if (cur === "req") reqModule(body, user, prof);
    else if (cur === "un") unModule(body, user, prof);
    else body.append(h("div", { class: "empty" }, "Слежение" + ": модуль будет подключён на следующем шаге."));
  };
  show(
    h("header", {}, h("img", { class: "emb", src: EMBLEM, alt: "" }), h("b", {}, "Логистика"), h("span", {}, prof.name || user.email), h("button", { class: "sm ghost", onclick: () => auth.signOut() }, "Выйти")),
    nav, body);
  draw();
}

function usersPanel(box, me) {
  box.append(h("div", { class: "empty" }, "Загрузка…"));
  unsubUsers = db.collection("users").onSnapshot(s => {
    box.innerHTML = "";
    const list = s.docs.map(d => Object.assign({ uid: d.id }, d.data()));
    list.sort((a, b) => (a.approved === b.approved ? 0 : a.approved ? 1 : -1) || String(a.name).localeCompare(String(b.name), "ru"));
    if (!list.length) box.append(h("div", { class: "empty" }, "Пользователей нет"));
    list.forEach(u => {
      const self = u.uid === me.uid;
      box.append(h("div", { class: "row" },
        h("div", { class: "grow" },
          h("div", { class: "n" }, (u.name || "—") + (u.admin ? " · админ" : "")),
          h("div", { class: "m" }, u.email || "")),
        h("span", { class: "badge" + (u.approved ? " g" : "") }, u.approved ? "Доступ есть" : "Ждёт"),
        self || u.admin ? null :
          h("button", { class: "sm" + (u.approved ? " red" : ""), onclick: () =>
            db.collection("users").doc(u.uid).update({ approved: !u.approved }).catch(e => alert(errText(e))) },
            u.approved ? "Закрыть" : "Одобрить")));
    });
  }, e => { box.innerHTML = ""; box.append(h("div", { class: "err" }, "Нет доступа к списку: " + (e.code || e.message))); });
}

/* ---------- маршрутизация ---------- */
async function route(user) {
  if (unsubProfile) { unsubProfile(); unsubProfile = null; }
  if (unsubUsers) { unsubUsers(); unsubUsers = null; }
  if (!user) { loginScreen("login"); return; }
  if (!user.emailVerified) { verifyScreen(user); return; }
  const ref = db.collection("users").doc(user.uid);
  try {
    const snap = await ref.get();
    if (!snap.exists) {
      const nm = (localStorage.getItem("pendingName") || "").trim() || (user.email || "").split("@")[0];
      await ref.set({ name: nm.substring(0, 80), email: user.email, approved: false, admin: false, createdAt: Date.now() });
    }
  } catch (e) {
    show(h("div", { class: "card" }, h("h1", {}, "Не удалось войти"), h("div", { class: "err" }, errText(e)),
      h("p", { class: "sub" }, "Если ошибка «unavailable»: проверьте интернет, отключите VPN и блокировщики рекламы, затем нажмите «Повторить»."),
      h("button", { class: "full", onclick: () => route(user) }, "Повторить"),
      h("button", { class: "full ghost", onclick: () => auth.signOut() }, "Выйти")));
    return;
  }
  unsubProfile = ref.onSnapshot(s => {
    const p = s.data();
    if (!p) return;
    if (p.approved === true) mainScreen(user, p); else pendingScreen(user);
  }, e => show(h("div", { class: "card" }, h("h1", {}, "Нет доступа"), h("div", { class: "err" }, errText(e)),
    h("button", { class: "full ghost", onclick: () => auth.signOut() }, "Выйти"))));
}

auth.onAuthStateChanged(route);
</script>
